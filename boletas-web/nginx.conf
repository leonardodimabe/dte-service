# Sitio público de consulta de boletas. Vive en su propio contenedor y su propio
# subdominio a propósito: es anónimo y está expuesto a internet, así que no debe
# compartir origen con el portal de administración, que custodia certificados.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sólo se expone la superficie pública del API. El resto no se proxya.
    location /api/public/ {
        proxy_pass http://api:8000/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
